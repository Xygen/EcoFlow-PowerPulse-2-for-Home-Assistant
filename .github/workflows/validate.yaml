name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  auth-ha:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_ha_test.txt
      - run: python -m pip install -r requirements_ha_test.txt
      - name: Real HA authentication flows (mocked EcoFlow)
        run: python -m pytest -q ha_tests -o asyncio_mode=auto --timeout=30

  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install -r requirements_test.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Python lint
        if: always()
        run: python -m ruff check custom_components tests scripts
      - name: Documentation consistency
        if: always()
        run: python scripts/check_consistency.py
      - name: Record checked revision
        if: always()
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
